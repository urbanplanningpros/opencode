name: publish
run-name: "fork release disabled"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain release workflow status
        run: |
          echo "Release publishing is disabled in urbanplanningpros/opencode."
          echo "The upstream publish workflow depends on anomalyco/opencode release credentials, signing secrets, package registry access, and Blacksmith runners."
          echo "Use the upstream repository release workflow or reintroduce a fork-specific publish workflow with the required secrets and runners."
