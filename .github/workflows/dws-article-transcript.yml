name: DWS Article Transcript

on:
  push:
    branches:
      - dws-dashboard-preview
    paths:
      - packages/pocketmarketer-bridge/strongworkflow/dws-content-command-center/tools/fetch_article_transcript.py
      - .github/workflows/dws-article-transcript.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcript:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dws-dashboard-preview
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python packages/pocketmarketer-bridge/strongworkflow/dws-content-command-center/tools/fetch_article_transcript.py
      - name: Commit transcript
        run: |
          git config user.name "strongworkflow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/pocketmarketer-bridge/strongworkflow/dws-content-command-center/src-013-transcript.txt
          git commit -m "Fetch SRC-013 transcript text"
          git pull --rebase origin dws-dashboard-preview
          git push origin HEAD:dws-dashboard-preview
