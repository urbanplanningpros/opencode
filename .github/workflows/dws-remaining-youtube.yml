name: DWS Remaining YouTube Sources

on:
  push:
    branches:
      - dws-dashboard-preview
    paths:
      - packages/pocketmarketer-bridge/strongworkflow/dws-content-command-center/tools/resolve_remaining_youtube.py
      - .github/workflows/dws-remaining-youtube.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dws-dashboard-preview
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - run: python packages/pocketmarketer-bridge/strongworkflow/dws-content-command-center/tools/resolve_remaining_youtube.py
      - name: Commit candidates
        run: |
          git config user.name "strongworkflow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/pocketmarketer-bridge/strongworkflow/dws-content-command-center/remaining-youtube-candidates.json
          git commit -m "Resolve remaining DWS YouTube candidates"
          git push origin HEAD:dws-dashboard-preview
