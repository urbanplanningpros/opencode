name: DWS YouTube Link Audit

on:
  push:
    branches:
      - dws-dashboard-preview
    paths:
      - packages/pocketmarketer-bridge/strongworkflow/dws-content-command-center/tools/resolve_youtube_links.py
      - .github/workflows/dws-youtube-link-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-youtube-links:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dws-dashboard-preview
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install resolver dependencies
        run: python -m pip install --disable-pip-version-check yt-dlp requests
      - name: Resolve exact YouTube watch URLs
        run: python packages/pocketmarketer-bridge/strongworkflow/dws-content-command-center/tools/resolve_youtube_links.py
      - name: Commit audit results
        run: |
          git config user.name "strongworkflow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/pocketmarketer-bridge/strongworkflow/dws-content-command-center/youtube-link-audit.json
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "Resolve DWS YouTube source candidates"
          git push origin HEAD:dws-dashboard-preview
