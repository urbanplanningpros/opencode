name: Operator model migration guard

on:
  push:
    branches:
      - "fix/operator-autopatch-guided-migration-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-operator-goal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Validate autonomous patch safety goal
        run: bun scripts/operator/validate-goal.mjs

      - name: Test guided model migration guard
        run: bun scripts/operator/model-retirement-migration-selftest.mjs

      - name: Reject retiring model references
        run: bun scripts/operator/model-retirement-migration.mjs --mode scan --root . --fail-on-findings
