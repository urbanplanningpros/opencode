name: Operator image edit continuity

on:
  pull_request:
    paths:
      - "scripts/operator/openai-image-edit-local.mjs"
      - "scripts/operator/openai-image-edit-local-selftest.mjs"
      - "docs/operator/openai-image-edit-continuity.md"
      - ".github/workflows/operator-image-edit-continuity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate executor syntax
        run: node --check scripts/operator/openai-image-edit-local.mjs
      - name: Validate direct route and four-reference request
        run: node scripts/operator/openai-image-edit-local-selftest.mjs
