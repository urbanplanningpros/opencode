name: Operator continuity policy

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Validate operator routing
        run: bun scripts/operator/validate-config.mjs

      - name: Check operator script syntax
        run: find scripts/operator -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Smoke test provider and model failover
        shell: bash
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/operator-state"
          FAKE_CLAUDE="$RUNNER_TEMP/fake-claude"
          cat > "$FAKE_CLAUDE" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          MODEL=""
          while [[ $# -gt 0 ]]; do
            if [[ "$1" == "--model" ]]; then
              MODEL="$2"
              shift 2
              continue
            fi
            shift
          done
          cat >/dev/null
          printf '%s' "$MODEL"
          SH
          chmod +x "$FAKE_CLAUDE"
          export OPERATOR_CLAUDE_BINARY="$FAKE_CLAUDE"
          export OPERATOR_ANTHROPIC_COMMAND='["node","scripts/operator/claude-wrapper.mjs"]'

          WRITE_TASK=$(bun scripts/operator/init-task.mjs \
            --state-dir "$STATE" \
            --objective "CI continuity write smoke test" \
            --acceptance "Provider executes|State persists" \
            --risk medium \
            --write \
            --handoff-safe true)
          bun scripts/operator/run-with-failover.mjs --state-dir "$STATE" --task "$WRITE_TASK" --profile continuity
          grep -q '"status": "awaiting_verification"' "$(dirname "$WRITE_TASK")/current-state.json"
          grep -q '"active_model": "claude-opus-4-8"' "$(dirname "$WRITE_TASK")/current-state.json"

          CANDIDATE_ID=$(node - <<'NODE'
          const crypto = require('crypto')
          for (let index = 0; ; index += 1) {
            const id = `ci-opus5-${index}`
            const bucket = Number.parseInt(
              crypto.createHash('sha256').update(`${id}:anthropic:model`).digest('hex').slice(0, 8),
              16,
            ) % 100
            if (bucket < 10) {
              process.stdout.write(id)
              break
            }
          }
          NODE
          )
          CANARY_TASK=$(bun scripts/operator/init-task.mjs \
            --state-dir "$STATE" \
            --task-id "$CANDIDATE_ID" \
            --objective "CI Opus 5 read-only canary" \
            --acceptance "Candidate model executes|Policy is exported" \
            --risk read_only)
          bun scripts/operator/run-with-failover.mjs --state-dir "$STATE" --task "$CANARY_TASK" --profile continuity
          grep -q '"active_model": "claude-opus-5"' "$(dirname "$CANARY_TASK")/current-state.json"

      - name: Smoke test durable queue
        shell: bash
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/operator-queue-state"
          FIRST=$(bun scripts/operator/queue-action.mjs \
            --state-dir "$STATE" \
            --action ci_smoke_test \
            --payload '{"ok":true}' \
            --idempotency-key ci-smoke-test-v1)
          SECOND=$(bun scripts/operator/queue-action.mjs \
            --state-dir "$STATE" \
            --action ci_smoke_test \
            --payload '{"ok":true}' \
            --idempotency-key ci-smoke-test-v1)
          test "$FIRST" = "$SECOND"
          export OPERATOR_ACTION_EXECUTOR_COMMAND='["node","-e","process.stdin.resume();process.stdin.on(\"end\",()=>process.stdout.write(JSON.stringify({verified:true})))"]'
          bun scripts/operator/process-queue.mjs --state-dir "$STATE"
          find "$STATE/queue/completed" -name '*.json' -print -quit | grep -q .

      - name: Enforce protected-path and agent-intake policy
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bun scripts/operator/check-pr-policy.mjs
