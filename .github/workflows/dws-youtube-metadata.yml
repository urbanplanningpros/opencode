name: DWS YouTube Metadata

on:
  push:
    branches:
      - dws-dashboard-preview
    paths:
      - packages/pocketmarketer-bridge/strongworkflow/dws-content-command-center/tools/fetch_youtube_metadata.py
      - .github/workflows/dws-youtube-metadata.yml
  workflow_dispatch:

concurrency:
  group: dws-youtube-metadata
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dws-dashboard-preview
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - run: python packages/pocketmarketer-bridge/strongworkflow/dws-content-command-center/tools/fetch_youtube_metadata.py
      - name: Commit metadata
        run: |
          git config user.name "strongworkflow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/pocketmarketer-bridge/strongworkflow/dws-content-command-center/youtube-metadata.json
          git commit -m "Fetch DWS YouTube metadata"
          git pull --rebase origin dws-dashboard-preview
          git push origin HEAD:dws-dashboard-preview
