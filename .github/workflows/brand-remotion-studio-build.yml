name: Build Brand Remotion Studio

on:
  push:
    branches:
      - brand-remotion-preview
    paths:
      - packages/pocketmarketer-bridge/strongworkflow/brand-video-studio-src/**
      - .github/workflows/brand-remotion-studio-build.yml
  workflow_dispatch:

concurrency:
  group: brand-remotion-studio-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand-remotion-preview
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        working-directory: packages/pocketmarketer-bridge/strongworkflow/brand-video-studio-src
        run: bun install --no-save
      - name: Validate example job
        working-directory: packages/pocketmarketer-bridge/strongworkflow/brand-video-studio-src
        run: bun run validate-job -- ./example/brand-video-job.json
      - name: Typecheck
        working-directory: packages/pocketmarketer-bridge/strongworkflow/brand-video-studio-src
        run: bun run typecheck
      - name: Build browser studio
        working-directory: packages/pocketmarketer-bridge/strongworkflow/brand-video-studio-src
        run: bun run build
      - name: Publish static preview directory
        run: |
          SOURCE="packages/pocketmarketer-bridge/strongworkflow/brand-video-studio-src"
          TARGET="packages/pocketmarketer-bridge/strongworkflow/brand-video-studio"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp -R "$SOURCE/dist/." "$TARGET/"
          touch "$TARGET/.nojekyll"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone
          target = Path('packages/pocketmarketer-bridge/strongworkflow/brand-video-studio')
          (target / 'build-info.json').write_text(json.dumps({
              'source_commit': os.environ['GITHUB_SHA'],
              'remotion_version': '4.0.527',
              'built_at': datetime.now(timezone.utc).isoformat(),
          }, indent=2) + '\n')
          PY
          test -f "$TARGET/index.html"
          grep -q "StrongWorkflow Brand Video Studio" "$TARGET/index.html"
      - name: Commit built preview
        run: |
          git config user.name "strongworkflow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/pocketmarketer-bridge/strongworkflow/brand-video-studio
          if git diff --cached --quiet; then
            echo "No preview changes"
            exit 0
          fi
          git commit -m "Build StrongWorkflow Remotion video studio"
          git push origin HEAD:brand-remotion-preview
