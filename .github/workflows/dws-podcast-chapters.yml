name: DWS Podcast Chapters

on:
  push:
    branches:
      - dws-dashboard-preview
    paths:
      - packages/pocketmarketer-bridge/strongworkflow/dws-content-command-center/tools/fetch_podcast_chapters.py
      - .github/workflows/dws-podcast-chapters.yml
  workflow_dispatch:

concurrency:
  group: dws-podcast-chapters
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  chapters:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dws-dashboard-preview
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - run: python packages/pocketmarketer-bridge/strongworkflow/dws-content-command-center/tools/fetch_podcast_chapters.py
      - name: Commit chapters
        run: |
          git config user.name "strongworkflow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/pocketmarketer-bridge/strongworkflow/dws-content-command-center/podcast-chapters.json
          git commit -m "Fetch DWS podcast chapters"
          git pull --rebase origin dws-dashboard-preview
          git push origin HEAD:dws-dashboard-preview
