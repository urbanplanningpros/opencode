<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading DWS Content Command Center…</title>

<script>
(async()=>{try{const bytes=Uint8Array.from(atob(window.__DWS_GZ||""),c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();document.open();document.write(html);document.close()}catch(error){document.body.innerHTML='<pre style="white-space:pre-wrap;padding:2rem">Dashboard failed to load: '+String(error)+'</pre>'}})();
</script></body></html>
